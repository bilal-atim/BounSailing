org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The build needs JDK 21 — AGP 8.7 rejects newer, and macOS ships 26 — so the
# repository carries one under tools/. Gradle reads org.gradle.java.home before
# any build script runs and does not resolve it relative to the project, so it
# cannot be set portably here. Point Gradle at it from your own machine instead:
#
#   echo "org.gradle.java.home=$PWD/tools/jdk-21.0.12+8/Contents/Home" \
#     >> ~/.gradle/gradle.properties
#
# See the build section of the top-level README.
