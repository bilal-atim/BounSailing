<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0B5C8A">
<meta name="description" content="Boğaziçi Üniversitesi yelken eğitim kütüphanesi ve Marmaris çevrimdışı deniz haritası">
<title>Boun Sailing</title>

<!-- iOS home-screen install: Safari does not read the web manifest for these. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boun Sailing">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-theme="day">

<div id="app">
  <!-- Kütüphane ------------------------------------------------------------->
  <section class="tab-panel" id="panel-library" hidden>
    <div class="lib-root">
      <div class="searchbar">
        <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg>
        <input id="lib-search" type="search" placeholder="Konu veya terim ara…"
               autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <button id="lib-search-clear" class="icon-btn" hidden aria-label="Aramayı temizle">
          <svg viewBox="0 0 24 24" class="icon"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div id="lib-scroll" class="scroll"></div>
    </div>
  </section>

  <!-- Harita ---------------------------------------------------------------->
  <section class="tab-panel" id="panel-chart" hidden>
    <div class="chart-root">
      <div class="readouts">
        <div class="readout"><span class="label">SOG</span><span class="value" id="ro-sog">--.-</span><span class="unit">kn</span></div>
        <div class="readout"><span class="label">COG</span><span class="value" id="ro-cog">---</span><span class="unit">°</span></div>
        <div class="readout gps"><span class="label" id="ro-fix-label">GPS</span><span class="value small" id="ro-acc">bekleniyor</span></div>
      </div>
      <div id="map"></div>
      <div class="chart-controls">
        <button id="btn-follow" class="fab primary" aria-label="Tekneye ortala">
          <svg viewBox="0 0 24 24" class="icon"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8m8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14"/></svg>
        </button>
        <button id="btn-theme" class="fab" aria-label="Tema değiştir"><span id="theme-glyph">☀</span></button>
        <button id="btn-layers" class="fab" aria-label="Katmanlar">
          <svg viewBox="0 0 24 24" class="icon"><path d="m11.99 18.54-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27z"/></svg>
        </button>
      </div>
      <div id="chart-sheet" class="sheet" hidden></div>
    </div>
  </section>

  <!-- Notlar ---------------------------------------------------------------->
  <section class="tab-panel" id="panel-notes" hidden>
    <div class="notes-root">
      <div class="notes-head">
        <h2>Notlar</h2>
        <button id="note-add" class="btn">Yeni not</button>
      </div>
      <div id="notes-list" class="scroll"></div>
    </div>
  </section>
</div>

<nav class="tabbar" role="tablist">
  <button class="tab" data-tab="library" role="tab">
    <svg viewBox="0 0 24 24" class="icon"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1m0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5z"/></svg>
    <span>Kütüphane</span>
  </button>
  <button class="tab" data-tab="chart" role="tab">
    <svg viewBox="0 0 24 24" class="icon"><path d="m20.5 3-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5M15 19l-6-2.11V5l6 2.11z"/></svg>
    <span>Harita</span>
  </button>
  <button class="tab" data-tab="notes" role="tab">
    <svg viewBox="0 0 24 24" class="icon"><path d="M3 10h11v2H3zm0-2h11V6H3zm0 8h7v-2H3zm15.01-3.13.71-.71a.996.996 0 0 1 1.41 0l.71.71c.39.39.39 1.02 0 1.41l-.71.71zm-.71.71-5.3 5.3V21h2.12l5.3-5.3z"/></svg>
    <span>Notlar</span>
  </button>
</nav>

<div id="toast" class="toast" hidden></div>

<script src="vendor/maplibre-gl.js" defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
